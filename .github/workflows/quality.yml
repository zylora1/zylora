name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ENVIRONMENT: test
  DATABASE_URL: postgresql+psycopg://zylora:zylora_test@localhost:5432/zylora_test
  REDIS_URL: redis://localhost:6379/0
  STORAGE_PROVIDER: memory
  API_INTERNAL_URL: http://127.0.0.1:8000
  WEB_ORIGINS: http://localhost:3000
  TRUSTED_HOSTS: localhost,127.0.0.1,testserver

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: zylora_test
          POSTGRES_USER: zylora
          POSTGRES_PASSWORD: zylora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zylora -d zylora_test" --health-interval 5s --health-timeout
          5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports: ['1025:1025']
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 5s --health-retries
          20
      redis:
        image: redis:8.2.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.17'
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: npm ci
      - run: uv sync --all-packages --frozen
      - run: npm run migrate
      - run: terraform -chdir=infra/cloudflare fmt -check
      - run: terraform -chdir=infra/cloudflare init -backend=false
      - run: terraform -chdir=infra/cloudflare validate
      - run: npm run quality
      - run: npm run test:integration
      - run: npm run security
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
