[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zylora-api"
version = "0.1.0"
description = "Canonical FastAPI service for Zylora V2"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.0",
  "aiosmtplib==5.1.2",
  "argon2-cffi==25.1.0",
  "authlib==1.7.2",
  "boto3==1.43.67",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.4",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zylora_api"]
