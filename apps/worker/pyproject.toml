[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zylora-worker"
version = "0.1.0"
description = "Idempotent background worker foundation for Zylora V2"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery==5.6.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zylora_worker"]
